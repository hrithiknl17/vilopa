name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, types, unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not db"

  seed:
    name: demo shop seed (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mita
          POSTGRES_PASSWORD: mita
          POSTGRES_DB: bharat_bazaar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mita -d bharat_bazaar"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      MITA_APP_PG_DSN: postgresql://mita:mita@localhost:5432/bharat_bazaar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run python examples/bharat-bazaar/seed.py
      - run: uv run pytest -m db
      - name: lint the demo data map through the GitHub Action
        uses: ./
        with:
          datamap: examples/bharat-bazaar/datamap.yaml
